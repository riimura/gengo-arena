name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (TZ=${{ matrix.tz }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tz: [Asia/Tokyo, UTC]
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: タイムゾーンの確認
        run: node -e 'console.log(Intl.DateTimeFormat().resolvedOptions().timeZone)'
      - run: npx vitest run
