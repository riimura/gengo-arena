<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="指でなぞると大正から令和まで日付が動き、和暦と西暦をその場で変換するデモ。">
<title>元号タイムライン</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#eef0f3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11152a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-title" content="元号">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@600;900&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<link rel="stylesheet" href="./style.css">
</head>
<body>
<main>
  <h1>元号タイムライン</h1>

  <section class="readout" id="readout" aria-live="polite">
    <div class="era-strip"></div>
    <div class="wareki"><span class="era" id="era">令和</span><span class="rest" id="rest">8年10月16日</span></div>
    <div class="seireki" id="seireki">西暦 2026年10月16日</div>
    <div class="note" id="note"></div>
    <div class="seal" id="seal" aria-hidden="true">改元</div>
  </section>

  <section class="scrub" aria-label="日付をなぞって選ぶ">
    <div class="label">バーを指でなぞる（1912年7月30日 〜 2035年）</div>
    <div class="track">
      <div class="band" id="band"></div>
      <input type="range" id="slider" min="0" max="1" step="1" value="0" aria-label="日付">
    </div>
    <div class="ticks" id="ticks"></div>
    <div class="controls">
      <button class="primary" id="play" type="button">▶ 大正から再生</button>
      <button id="today" type="button">今日</button>
      <input type="date" id="picker" min="1912-07-30" max="2035-12-31" aria-label="日付を選ぶ">
    </div>
  </section>

  <section class="reverse" aria-label="和暦から西暦へ">
    <h2>和暦 → 西暦</h2>
    <div class="row">
      <select id="r-era" aria-label="元号">
        <option>大正</option><option>昭和</option><option>平成</option><option selected>令和</option>
      </select>
      <input id="r-year" type="number" inputmode="numeric" value="1" aria-label="年"><span class="u">年</span>
      <input id="r-month" type="number" inputmode="numeric" value="5" aria-label="月"><span class="u">月</span>
      <input id="r-day" type="number" inputmode="numeric" value="1" aria-label="日"><span class="u">日</span>
    </div>
    <div class="result" id="r-out" aria-live="polite"></div>
    <div class="hint">境目を試す:
      <button type="button" data-try="平成,31,4,30">平成31年4月30日</button>
      <button type="button" data-try="平成,31,5,1">平成31年5月1日</button>
      <button type="button" data-try="昭和,64,1,8">昭和64年1月8日</button>
      <button type="button" data-try="令和,3,2,29">令和3年2月29日</button>
    </div>
  </section>

  <footer>
    変換には <a href="https://github.com/riimura/gengo-arena/blob/main/src/wareki.ts">src/wareki.ts</a> をそのまま使っています。
    ソース: <a href="https://github.com/riimura/gengo-arena">riimura/gengo-arena</a>
    <p class="install">ホーム画面に追加すると、アプリのように全画面で開けて、電波がないときも使えます（iPhone は Safari の共有ボタン →「ホーム画面に追加」）。</p>
  </footer>
</main>
<script type="module" src="./main.ts"></script>
</body>
</html>
